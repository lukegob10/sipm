[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sipm-treasury-analytics-local-mock"
version = "0.1.0"
description = "Local-only treasury_analytics connector mock for SIPM deployment rehearsal."
requires-python = ">=3.12"
dependencies = ["oracledb>=4,<5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
