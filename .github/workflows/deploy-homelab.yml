name: Deploy Home Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: home-lab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, homelab, docker, sipm]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sipm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm runner
        run: |
          hostname
          whoami
          docker --version
          docker compose version

      - name: Prepare local env file
        env:
          HOMELAB_ENV_FILE: ${{ secrets.HOMELAB_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -n "${HOMELAB_ENV_FILE}" ]; then
            printf '%s\n' "${HOMELAB_ENV_FILE}" > .env
          elif [ ! -f .env ]; then
            cp deployment/.env.example .env
          fi

      - name: Deploy
        env:
          INSTALL_TREASURY_ANALYTICS_MOCK: ${{ vars.INSTALL_TREASURY_ANALYTICS_MOCK || 'true' }}
          TREASURY_ANALYTICS_PACKAGE: ${{ vars.TREASURY_ANALYTICS_PACKAGE }}
          PIP_EXTRA_INDEX_URL: ${{ secrets.PIP_EXTRA_INDEX_URL }}
        run: |
          set -euo pipefail
          docker compose build
          docker compose run --rm --no-deps sipm python -m backend.app.db.developer_mode_schema
          docker compose run --rm --no-deps sipm python -m backend.app.db.project_function_area_schema
          docker compose run --rm --no-deps sipm python -m backend.app.db.phase_catalog_data
          docker compose up -d
          docker compose ps
