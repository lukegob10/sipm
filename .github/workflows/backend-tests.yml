name: Backend Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/main/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Verify dependency lock file
        run: python scripts/check_requirements_lock.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/main/requirements.txt

      - name: Install frontend tooling
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Import check
        working-directory: src/main
        run: python -c "import backend.main; print('ok')"

      - name: Route module test mapping gate
        run: python scripts/check_route_module_test_mapping.py

      - name: Run backend tests
        env:
          SIPM_REDIS_URL: redis://127.0.0.1:6379/1
        run: pytest -q -s src/main/test

      - name: Lint frontend
        run: npm run lint:ui

      - name: Run frontend unit tests
        run: npm run test:ui

      - name: Run frontend smoke tests
        run: npm run test:ui:smoke
