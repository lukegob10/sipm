name: Backend Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/main/requirements.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Verify dependency lock file
        run: python scripts/check_requirements_lock.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/main/requirements.txt

      - name: Import check
        working-directory: src/main
        run: python -c "import backend.main; print('ok')"

      - name: Route module test mapping gate
        run: python scripts/check_route_module_test_mapping.py

      - name: Run backend tests
        run: pytest -q -s src/main/test
